# Thunder look: a heavier, darker storm haze than rain.
# Strength follows the vanilla thunder gradient, which ramps over about five seconds.
# Community Edition: see rain.conf. Authoring guide: ../../README.md

# Fog: about 40% transmittance at 100 blocks.
rtx.volumetrics.transmittanceMeasurementDistanceMeters = 40.0
rtx.volumetrics.transmittanceColor = 0.85, 0.86, 0.89
rtx.volumetrics.singleScatteringAlbedo = 0.93, 0.93, 0.96
rtx.volumetrics.anisotropy = 0.3

rtx.volumetrics.enableHeterogeneousFog = True
rtx.volumetrics.noiseFieldInitialFrequencyPerMeter = 0.05
rtx.volumetrics.noiseFieldOctaves = 3
rtx.volumetrics.noiseFieldLacunarity = 2.2
rtx.volumetrics.noiseFieldGain = 0.55
rtx.volumetrics.noiseFieldTimeScale = 0.5
rtx.volumetrics.noiseFieldDensityScale = 1.5
rtx.volumetrics.noiseFieldDensityExponent = 1.5
rtx.volumetrics.noiseFieldSubStepSizeMeters = 4.0

rtx.localtonemap.shadows = 1.15
rtx.localtonemap.exposure = 0.15
rtx.autoExposure.evMaxValue = 0.25

# Wind-roughened water: faster, finer crossing wave layers while it rains.
rtx.translucentMaterial.animatedWaterPrimaryNormalMotion = 0.05, 0.035
rtx.translucentMaterial.animatedWaterSecondaryNormalMotion = -0.04, -0.06
rtx.translucentMaterial.animatedWaterSecondaryNormalLodBias = 0.5
