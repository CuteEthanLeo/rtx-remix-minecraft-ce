# Rain look: a grey, moving rain haze, and an exposure that lets an overcast
# day read darker than a sunny one instead of lifting it back to daylight.
# Strength follows the vanilla rain gradient, which ramps over about five seconds.
# Community Edition: denser scattering fog with drifting heterogeneous density,
# and the upstream shadow lift and exposure cap replaced. Authoring guide:
# ../../README.md

# Fog: about two thirds transmittance at 100 blocks, scattering light-grey so
# the sky ambient and sun glow inside it rather than only dimming the view.
rtx.volumetrics.transmittanceMeasurementDistanceMeters = 60.0
rtx.volumetrics.transmittanceColor = 0.90, 0.91, 0.93
rtx.volumetrics.singleScatteringAlbedo = 0.95, 0.95, 0.97
rtx.volumetrics.anisotropy = 0.3

# Drifting rain curtains: low-frequency density noise, tens of blocks across.
rtx.volumetrics.enableHeterogeneousFog = True
rtx.volumetrics.noiseFieldInitialFrequencyPerMeter = 0.04
rtx.volumetrics.noiseFieldOctaves = 3
rtx.volumetrics.noiseFieldLacunarity = 2.2
rtx.volumetrics.noiseFieldGain = 0.5
rtx.volumetrics.noiseFieldTimeScale = 0.3
rtx.volumetrics.noiseFieldDensityScale = 1.3
rtx.volumetrics.noiseFieldDensityExponent = 1.5
rtx.volumetrics.noiseFieldSubStepSizeMeters = 4.0

# Tonemap: keep shadow depth so the overcast light does not look flat.
rtx.localtonemap.shadows = 1.25
rtx.localtonemap.exposure = 0.17

# Allow the overcast scene to stay darker than daylight, while still capping
# how far a bright cloud layer can expose the ground down.
rtx.autoExposure.evMaxValue = 0.5

# Wind-roughened water: faster, finer crossing wave layers while it rains.
rtx.translucentMaterial.animatedWaterPrimaryNormalMotion = 0.03, 0.02
rtx.translucentMaterial.animatedWaterSecondaryNormalMotion = -0.025, -0.04
rtx.translucentMaterial.animatedWaterSecondaryNormalLodBias = 0.75
