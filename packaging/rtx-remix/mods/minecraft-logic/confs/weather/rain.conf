# Rain look, modelled on how shader packs draw rain: a bright grey overcast
# haze that softens distance rather than a dark fog, lifted shadows for soft
# overcast light, and no darkening of the exposure.
# Strength follows the vanilla rain gradient, which ramps over about five seconds.
# Community Edition. Authoring guide: ../../README.md

# Fog: light, highly scattering, about 80% transmittance at 100 blocks, so the
# distance turns grey toward the sky instead of black.
rtx.volumetrics.transmittanceMeasurementDistanceMeters = 90.0
rtx.volumetrics.transmittanceColor = 0.93, 0.935, 0.945
rtx.volumetrics.singleScatteringAlbedo = 0.99, 0.99, 0.995
# Community Edition 0.1.0-ce.3: more forward scattering, so the haze glows
# toward the sun where it breaks through gaps in the clouds ("Cloud-gap
# shafts" gives the sun back a share of its light in the haze).
rtx.volumetrics.anisotropy = 0.45

# Drifting rain curtains: three octaves and a steeper density curve, so
# denser sheets of rain pass between clearer gaps instead of an even grey.
rtx.volumetrics.enableHeterogeneousFog = True
rtx.volumetrics.noiseFieldInitialFrequencyPerMeter = 0.03
rtx.volumetrics.noiseFieldOctaves = 3
rtx.volumetrics.noiseFieldLacunarity = 2.0
rtx.volumetrics.noiseFieldGain = 0.55
rtx.volumetrics.noiseFieldTimeScale = 0.35
rtx.volumetrics.noiseFieldDensityScale = 1.15
rtx.volumetrics.noiseFieldDensityExponent = 1.6
rtx.volumetrics.noiseFieldSubStepSizeMeters = 4.0

# Soft overcast light: open shadows, and keep a dark sky from exposing the
# scene down.
rtx.localtonemap.shadows = 1.6
rtx.autoExposure.evMaxValue = -0.75

# Wind-roughened water: faster, finer crossing wave layers while it rains.
rtx.translucentMaterial.animatedWaterPrimaryNormalMotion = 0.03, 0.02
rtx.translucentMaterial.animatedWaterSecondaryNormalMotion = -0.025, -0.04
rtx.translucentMaterial.animatedWaterSecondaryNormalLodBias = 0.75
