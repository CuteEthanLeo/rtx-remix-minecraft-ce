# Community Edition "Natural daylight" look. Follows the day profile's
# strength exactly (it sits between day and dusk in priority), and only while
# the setting is on, so turning it off restores the upstream daytime.
# Authoring guide: ../../README.md

# Aerial perspective instead of a white veil. Remix's default medium is
# neutral grey and scatters equally in every direction, so under a strong sun
# it lays the same milky haze over everything. Real clear air loses blue
# faster than red, so the light it scatters into the view is blue: distant
# hills turn pale blue. Mostly-forward scattering keeps the haze bright toward
# the sun and transparent with the sun behind you.
rtx.volumetrics.transmittanceMeasurementDistanceMeters = 300.0
rtx.volumetrics.transmittanceColor = 0.98, 0.975, 0.962
rtx.volumetrics.singleScatteringAlbedo = 0.97, 0.975, 0.98
rtx.volumetrics.anisotropy = 0.55

# Lift shadows a little less than the 1.4 baseline. The contrast between sun
# and shade mainly comes from a dimmer sky fill (see community/DaylightSky);
# this only stops the tonemapper from flattening it again. A player who has
# moved the Shadows slider keeps their own value.
rtx.localtonemap.shadows = 1.2
