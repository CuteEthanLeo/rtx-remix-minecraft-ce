# Night look: caps auto-exposure so the sky stays dark and raises bloom so
# emitters bloom. Applies from dusk through night until the blend to dawn.
# Authoring guide: ../../README.md

# Cap auto-exposure so a dark sky never drives exposure down; matches dusk
# so the two do not oscillate.
rtx.autoExposure.evMaxValue = -0.5
# Community Edition: the night is lit by the moon and a physically dim sky,
# without the old second sky light, so let auto-exposure reach further into
# the dark than the daytime -2.5. A moonlit field stays readable; a forest
# floor or a new-moon night stays dark.
rtx.autoExposure.evMinValue = -4.0

# Night deliberately reverses the selective daytime baseline: the low
# pre-tonemap threshold admits dimmer emitters, while the higher burn intensity
# makes their bloom visible. Treat these two values as one authored pair.
rtx.bloom.burnIntensity = 1.5
rtx.bloom.luminanceThreshold = 1

# Community Edition: a thin night haze with forward scattering, so lit windows,
# lamps, and the moon gather a soft glow in the air, and a slightly lower
# exposure so night stays night around bright emitters.
rtx.volumetrics.transmittanceMeasurementDistanceMeters = 120.0
rtx.volumetrics.transmittanceColor = 0.95, 0.95, 0.96
rtx.volumetrics.singleScatteringAlbedo = 0.98, 0.98, 0.99
rtx.volumetrics.anisotropy = 0.5
rtx.localtonemap.exposure = 0.19
