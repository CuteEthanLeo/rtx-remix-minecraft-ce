# Dawn look: low morning mist that the sun shines through in shafts, and that
# the day burns off.
# Community Edition: authored values; upstream leaves dawn empty.
# Authoring guide: ../../README.md

# Mist: about 60% transmittance at 100 blocks, almost pure scattering. Strong
# forward scattering makes the haze glow toward the low sun and stay clear
# with the sun behind you, so trees and hills cut visible shafts out of it.
# The sun's volumetric scale rises at golden hour (Community Edition
# "Golden-hour shafts"), which is what makes the shafts bright.
rtx.volumetrics.transmittanceMeasurementDistanceMeters = 110.0
rtx.volumetrics.transmittanceColor = 0.93, 0.935, 0.95
rtx.volumetrics.singleScatteringAlbedo = 0.99, 0.99, 0.995
rtx.volumetrics.anisotropy = 0.72

# Patchy mist: large, slow drifting banks rather than an even veil.
rtx.volumetrics.enableHeterogeneousFog = True
rtx.volumetrics.noiseFieldInitialFrequencyPerMeter = 0.02
rtx.volumetrics.noiseFieldOctaves = 3
rtx.volumetrics.noiseFieldLacunarity = 2.0
rtx.volumetrics.noiseFieldGain = 0.5
rtx.volumetrics.noiseFieldTimeScale = 0.08
rtx.volumetrics.noiseFieldDensityScale = 1.0
rtx.volumetrics.noiseFieldDensityExponent = 1.3
rtx.volumetrics.noiseFieldSubStepSizeMeters = 4.0
