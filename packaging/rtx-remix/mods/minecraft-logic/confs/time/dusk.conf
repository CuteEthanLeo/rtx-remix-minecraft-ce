# Dusk look: caps auto-exposure so the bright evening sky does not darken
# the scene. Applies during the day -> dusk -> night transition.
# Authoring guide: ../../README.md

# Prevent downward exposure adaptation while looking at the bright evening sky.
# Dusk should adapt upward only; darkening an already dim scene feels unnatural.
rtx.autoExposure.evMaxValue = -0.5

# Community Edition: warm evening haze for sunset shafts. The red channel
# loses a little more than blue, so the haze in-scatters a faint amber; strong
# forward scattering keeps it bright toward the setting sun and clear behind
# you. Smoother than the dawn mist: evening air is dusty, not foggy.
rtx.volumetrics.transmittanceMeasurementDistanceMeters = 140.0
rtx.volumetrics.transmittanceColor = 0.94, 0.945, 0.95
rtx.volumetrics.singleScatteringAlbedo = 0.99, 0.985, 0.98
rtx.volumetrics.anisotropy = 0.7
