# Dusk look: caps auto-exposure so the bright evening sky does not darken
# the scene. Applies during the day -> dusk -> night transition.
# Authoring guide: ../../README.md

# Prevent downward exposure adaptation while looking at the bright evening sky.
# Dusk should adapt upward only; darkening an already dim scene feels unnatural.
rtx.autoExposure.evMaxValue = -0.5

# Community Edition: a light evening haze between the clear day and the night
# haze, so the volumetric values animate through dusk instead of jumping.
rtx.volumetrics.transmittanceMeasurementDistanceMeters = 150.0
rtx.volumetrics.transmittanceColor = 0.97, 0.965, 0.96
rtx.volumetrics.singleScatteringAlbedo = 0.98, 0.98, 0.98
rtx.volumetrics.anisotropy = 0.5
